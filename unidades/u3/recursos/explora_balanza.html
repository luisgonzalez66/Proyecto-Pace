<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balanza de ecuaciones</title>
<style>
*{box-sizing:border-box}body{margin:0;font:600 15px/1.4 Nunito,system-ui,-apple-system,Segoe UI,sans-serif;color:#2b2a6b;background:#fffdf6;padding:10px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.eq{font-size:24px;font-weight:900;letter-spacing:.02em}.eq i{color:#c2406f;font-style:normal}
select,button{font:inherit;font-weight:800;color:#2b2a6b}
select{min-height:40px;border:2px solid #2b2a6b;border-radius:10px;padding:4px 8px;background:#fff}
button{min-height:42px;border:2px solid #2b2a6b;border-radius:10px;background:#fff;padding:6px 10px;cursor:pointer;box-shadow:2px 2px 0 #2b2a6b}
button:hover:not(:disabled){background:#fff1c4}button:disabled{opacity:.4;cursor:default;box-shadow:none}
button:focus-visible,select:focus-visible{outline:3px solid #4b49a3;outline-offset:2px}
svg{display:block;width:100%;max-height:300px;margin:4px auto}
.msg{min-height:44px;padding:8px 12px;border-radius:12px;background:#eef0ff;border:2px solid #4b49a3;font-weight:700}
.msg.ok{background:#e8f6f1;border-color:#2f9a78}.msg.bad{background:#fdebf1;border-color:#c2406f}
.pads{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.grp{border:2px dashed #b9bcd8;border-radius:12px;padding:6px 8px}.grp b{display:block;font-size:12px;letter-spacing:.08em;color:#5b6070;margin-bottom:4px}
.grp .r{display:flex;gap:6px;flex-wrap:wrap}.hint{font-size:13px;color:#5b6070;margin:6px 0 0}
</style></head><body>
<div class="top"><div class="eq" id="eq" aria-live="polite"></div><label>Ecuación <select id="pick"><option value="0">2x + 3 = 7</option><option value="1">3x + 2 = x + 8</option><option value="2">4x = 12</option></select></label></div>
<svg id="sv" viewBox="0 0 640 330" role="img" aria-label="Balanza de dos platos"><rect x="312" y="80" width="16" height="212" fill="#2b2a6b"/><rect x="230" y="290" width="180" height="16" rx="6" fill="#2b2a6b"/><g id="beam" style="transform-origin:320px 80px"></g><g id="pg"></g></svg>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div class="pads">
<div class="grp"><b>SOLO A LA IZQUIERDA</b><div class="r"><button id="lp">+1</button><button id="lm">−1</button></div></div>
<div class="grp"><b>SOLO A LA DERECHA</b><div class="r"><button id="rp">+1</button><button id="rm">−1</button></div></div>
<div class="grp"><b>A LOS DOS LADOS</b><div class="r"><button id="bp">+1</button><button id="bm">−1</button><button id="bx">quitar x</button></div></div>
<div class="grp"><b>REPARTIR</b><div class="r"><button id="dv">÷ 2</button><button id="rs">↺ Reiniciar</button></div></div>
</div>
<p class="hint">Cada bolsa <b>x</b> esconde el mismo número de fichas. Prueba hacer algo en un solo plato y mira qué pasa. El objetivo es dejar la bolsa sola en un plato.</p>
<script>
var EQ=[{a1:2,b1:3,a2:0,b2:7,X:2},{a1:3,b1:2,a2:1,b2:8,X:3},{a1:4,b1:0,a2:0,b2:12,X:3}];
var S,X,N=document.getElementById('beam'),NS='http://www.w3.org/2000/svg';
function $(i){return document.getElementById(i)}
function gcd(a,b){return b?gcd(b,a%b):a}
function load(i){var e=EQ[i];S={a1:e.a1,b1:e.b1,a2:e.a2,b2:e.b2};X=e.X;draw(true)}
function side(a,b){return (a?(a>1?a:'')+'x':'')+(a&&b?' + ':'')+(b||!a?b:'')}
function el(t,at,p){var e=document.createElementNS(NS,t);for(var k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e}
function pan(g,x,y,a,b){var p=el('g',{class:'pan',transform:'translate('+x+','+y+')'},g);
 el('line',{x1:0,y1:0,x2:-70,y2:70,stroke:'#2b2a6b','stroke-width':3},p);el('line',{x1:0,y1:0,x2:70,y2:70,stroke:'#2b2a6b','stroke-width':3},p);
 el('path',{d:'M-90 70 H90 Q80 100 50 100 H-50 Q-80 100 -90 70Z',fill:'#4b49a3',stroke:'#2b2a6b','stroke-width':3},p);
 var items=[];for(var i=0;i<a;i++)items.push('x');for(var j=0;j<b;j++)items.push('1');
 var per=items.length>12?8:6,sz=items.length>12?24:30;
 items.forEach(function(t,k){var r=Math.floor(k/per),c=k%per,n=Math.min(per,items.length-r*per),px=(c-(n-1)/2)*(sz+4),py=66-sz/2-r*(sz+4)-2;
  if(t==='x'){el('rect',{x:px-sz/2,y:py-sz/2,width:sz,height:sz,rx:8,fill:'#c2406f',stroke:'#2b2a6b','stroke-width':2},p)}
  else{el('circle',{cx:px,cy:py,r:sz/2,fill:'#f0b54a',stroke:'#2b2a6b','stroke-width':2},p)}
  var tx=el('text',{x:px,y:py+5,'text-anchor':'middle','font-size':sz*.55,'font-weight':900,fill:t==='x'?'#fff':'#2b2a6b'},p);tx.textContent=t;});}
function draw(first){
 var L=S.a1*X+S.b1,R=S.a2*X+S.b2,d=L-R,m=Math.max(L,R,1),th=-Math.max(-1,Math.min(1,d/m*2))*14;
 N.innerHTML='';
 N.style.transform='rotate('+th+'deg)';
 el('rect',{x:120,y:74,width:400,height:12,rx:6,fill:'#2b2a6b'},N);el('circle',{cx:320,cy:80,r:9,fill:'#f0b54a',stroke:'#2b2a6b','stroke-width':3},N);
 var rad=th*Math.PI/180,lx=320-200*Math.cos(rad),ly=80-200*Math.sin(rad),rx=320+200*Math.cos(rad),ry=80+200*Math.sin(rad);
 var pg=$('pg');pg.innerHTML='';
 pan(pg,lx,ly,S.a1,S.b1);pan(pg,rx,ry,S.a2,S.b2);
 $('eq').innerHTML=side(S.a1,S.b1).replace(/x/g,'<i>x</i>')+' = '+side(S.a2,S.b2).replace(/x/g,'<i>x</i>');
 var done=S.a1===1&&S.b1===0&&S.a2===0,eq=d===0,m2=$('msg');
 if(done){m2.className='msg ok';m2.textContent='¡Lo lograste! La bolsa vale '+S.b2+': x = '+S.b2+'. Dejaste la incógnita sola haciendo lo mismo en los dos platos.'}
 else if(!eq){m2.className='msg bad';m2.textContent='La balanza se inclina: el plato '+(d>0?'izquierdo':'derecho')+' pesa más. Ya no hay igualdad. Haz lo mismo en el otro plato o deshaz el último paso.'}
 else{m2.className='msg';m2.textContent=first?'La balanza está en equilibrio: los dos lados valen lo mismo. ¿Cómo dejarías la bolsa x sola en un plato?':'Sigue en equilibrio: hiciste lo mismo en los dos platos.'}
 $('lm').disabled=S.b1<1;$('rm').disabled=S.b2<1;$('bm').disabled=S.b1<1||S.b2<1;$('bx').disabled=S.a1<1||S.a2<1;
 var g=gcd(gcd(S.a1,S.b1),gcd(S.a2,S.b2));$('dv').disabled=!(g>1);$('dv').textContent='÷ '+(g>1?g:2);$('dv').dataset.g=g>1?g:0;
}
function go(k){return function(){var s=S;if(k==='lp')s.b1++;if(k==='rp')s.b2++;if(k==='lm'&&s.b1>0)s.b1--;if(k==='rm'&&s.b2>0)s.b2--;
 if(k==='bp'){s.b1++;s.b2++}if(k==='bm'&&s.b1>0&&s.b2>0){s.b1--;s.b2--}if(k==='bx'&&s.a1>0&&s.a2>0){s.a1--;s.a2--}
 if(k==='dv'){var g=+$('dv').dataset.g;if(g>1){s.a1/=g;s.b1/=g;s.a2/=g;s.b2/=g;X=X}}
 draw(false)}}
['lp','lm','rp','rm','bp','bm','bx','dv'].forEach(function(k){$(k).onclick=go(k)});
$('rs').onclick=function(){load(+$('pick').value)};$('pick').onchange=function(){load(+$('pick').value)};
load(0);
function rep(){try{parent.postMessage({pace:'explora-h',h:document.documentElement.scrollHeight},'*')}catch(e){}}
new ResizeObserver(rep).observe(document.body);window.addEventListener('load',rep);rep();
</script></body></html>
