name: Regenerar y publicar las unidades

# Cada vez que llega a main un cambio en el JSON o en los recursos de una unidad
# (o en el motor del curso), este flujo:
#   1. valida los tres JSON (si alguno falla, no publica nada);
#   2. regenera las páginas de las unidades (unidades/uN/html/) y el catálogo de estaciones del editor;
#   3. regenera el catálogo de preguntas (herramientas/CATALOGO_PREGUNTAS_PACE.xlsx);
#   4. sube los archivos regenerados a main, y GitHub Pages los publica;
#   5. actualiza la página de descargas «Última versión» (Releases, etiqueta ultima-version), con enlaces fijos a:
#      SCORM_CURSO_COMPLETO.zip, PACE_CURSO_COMPLETO.html, PAQUETE_UNIDAD_0N.zip y CATALOGO_PREGUNTAS_PACE.xlsx.
# Así cada docente solo sube su JSON (y sus recursos); nadie necesita ejecutar construir_curso.py.
# Si alguien sube a mano archivos de unidades/uN/html/, también se regeneran y quedan bien.

on:
  push:
    branches: [main]
    paths:
      - 'unidades/*/unidad_*.json'
      - 'unidades/*/recursos/**'
      - 'unidades/*/html/**'
      - 'herramientas/curso_completo/**'
      - 'editor/motor_bundle.js'
      - '.github/workflows/publicar_unidades.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-unidades
  cancel-in-progress: false

jobs:
  construir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -q openpyxl

      - name: Validar las unidades
        run: |
          for f in unidades/u*/unidad_*.json; do
            if ! out=$(node herramientas/validar.js "$f" 2>&1); then
              echo "::error title=La unidad no pasa la validación ($f)::$(echo "$out" | tail -3 | tr '\n' ' ')"
              exit 1
            fi
            echo "$out"
          done

      - name: Regenerar las páginas de las unidades
        run: |
          if ! out=$(python3 herramientas/curso_completo/construir_curso.py "$RUNNER_TEMP/scorm" sitio 2>&1); then
            echo "::error title=Falló la regeneración de las páginas::$(echo "$out" | tail -4 | tr '\n' ' ')"
            exit 1
          fi
          echo "$out"

      - name: Regenerar el catálogo de preguntas
        run: |
          if ! out=$(python3 herramientas/generar_catalogo.py 2>&1); then
            echo "::error title=Falló el catálogo de preguntas::$(echo "$out" | tail -4 | tr '\n' ' ')"
            exit 1
          fi
          echo "$out"

      - name: Guardar el SCORM del curso completo
        uses: actions/upload-artifact@v4
        with:
          name: SCORM_CURSO_COMPLETO
          path: ${{ runner.temp }}/scorm/SCORM_CURSO_COMPLETO.zip
          retention-days: 30

      - name: Publicar los archivos regenerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898899+github-actions[bot]@users.noreply.github.com"
          git add index.html unidades/*/html editor/catalogo_estaciones.js herramientas/CATALOGO_PREGUNTAS_PACE.xlsx
          echo "::notice title=Archivos modificados::$(git status --short | head -20 | tr '\n' ' ')"
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
            exit 0
          fi
          git commit -m "Regenerar las páginas de las unidades (automático, tras ${GITHUB_SHA::7})"
          git stash -u -q || true
          for i in 1 2 3; do
            if out=$(git pull -q --rebase origin main 2>&1 && git push -q origin HEAD:main 2>&1); then exit 0; fi
            echo "::warning title=Intento $i de publicar::$(echo "$out" | tail -3 | tr '\n' ' ')"
            sleep 5
          done
          echo "No se pudo publicar: hubo cambios simultáneos. Vuelve a ejecutar el flujo." && exit 1

      - name: Preparar las descargas
        run: |
          D="$RUNNER_TEMP/descargas"; mkdir -p "$D"
          cp "$RUNNER_TEMP/scorm/SCORM_CURSO_COMPLETO.zip" "$D/"
          python3 herramientas/curso_completo/html_unico.py "$D/SCORM_CURSO_COMPLETO.zip" "$D/PACE_CURSO_COMPLETO.html"
          for u in unidades/u*/; do
            n=$(basename "$u" | tr -dc '0-9'); j=$(ls "$u"unidad_*.json | head -1)
            (cd "$u" && zip -q -r "$D/PAQUETE_UNIDAD_0$n.zip" "$(basename "$j")" $( [ -d recursos ] && echo recursos ))
          done
          cp herramientas/CATALOGO_PREGUNTAS_PACE.xlsx "$D/"
          ls -la "$D"

      - name: Actualizar la página «Última versión»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$RUNNER_TEMP/descargas"; R="https://github.com/${{ github.repository }}/releases/download/ultima-version"
          FECHA=$(TZ=America/Santiago date '+%d-%m-%Y %H:%M')
          MSG=$(git log -1 --format=%s ${{ github.sha }})
          cat > "$RUNNER_TEMP/notas.md" <<NOTAS
          Versión vigente del curso, generada automáticamente el **$FECHA** (hora de Chile), a partir del cambio \`${GITHUB_SHA::7}\`: «$MSG».

          | Archivo | Para qué sirve |
          |---|---|
          | [SCORM_CURSO_COMPLETO.zip]($R/SCORM_CURSO_COMPLETO.zip) | Subir a SiveducMD |
          | [PACE_CURSO_COMPLETO.html]($R/PACE_CURSO_COMPLETO.html) | El curso completo en un solo archivo, para abrir en el navegador |
          | [PAQUETE_UNIDAD_01.zip]($R/PAQUETE_UNIDAD_01.zip) · [02]($R/PAQUETE_UNIDAD_02.zip) · [03]($R/PAQUETE_UNIDAD_03.zip) | Abrir cada unidad en el editor |
          | [CATALOGO_PREGUNTAS_PACE.xlsx]($R/CATALOGO_PREGUNTAS_PACE.xlsx) | Catálogo de preguntas (incluye respuestas: uso interno) |

          Los enlaces no cambian: siempre descargan la última versión.
          NOTAS
          sed -i 's/^          //' "$RUNNER_TEMP/notas.md"
          if ! gh release view ultima-version >/dev/null 2>&1; then
            gh release create ultima-version --title "Última versión" --notes-file "$RUNNER_TEMP/notas.md" --latest
          fi
          gh release upload ultima-version "$D"/* --clobber
          gh release edit ultima-version --title "Última versión" --notes-file "$RUNNER_TEMP/notas.md"
